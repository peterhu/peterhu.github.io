---
layout: page
title: Archive (中文)
---

<div class="page page-categories">
  <div class="list-post">
    <h2>Chinese Posts (2020–2021)</h2>
    <ul>
      {% assign zh_posts = site.posts | where_exp: "post", "post.lang == 'zh'" %}
      {%- for post in zh_posts %}
      <li>
        <span class="date">{{ post.date | date: "%Y/%m/%d" }}</span>
        <div class="title">
          <a href="{{ site.baseurl | append: post.url }}" class="hover-underline">{{ post.title }}</a>
        </div>
      </li>
      {%- endfor %}
    </ul>
  </div>
</div>
