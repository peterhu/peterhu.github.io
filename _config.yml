encoding: utf-8

# SEO
title: DRAM Detective — DDR Memory Training Case Files
description: DDR5 memory training case files — deep dives into memory architecture, by a memory firmware engineer
keywords: DDR5,DRAM,memory training,memory controller,firmware,BIOS,JEDEC
author: Peter Hu
footerText: 'Powered by My Mind'

# 这些不要动
permalink: /posts/:year/:month/:day/:title.html
kramdown:
  auto_ids: true
  input: GFM
exclude: ['CNAME', 'README.md', 'LICENSE', '_site', 'dist', 'Gemfile', 'Gemfile.lock', 'cli.bat', 'dist.tar.gz', 'CODING_PLAN.md']

# 域名配置
# baseurl配置,如果网站部署在根目录下的其他目录中，请设置为 /目录名
#domainUrl: 'http://blog.tmaize.net'
baseurl: ''

# 默认 front matter：老中文文默认 lang=zh，新英文文显式写 lang: en 覆盖
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      lang: zh

# 菜单
menu:
  - title: Home
    url: /
  - title: Categories
    url: /pages/categories.html
  - title: Search
    url: /pages/search.html
  - title: Archive
    url: /pages/archive-zh.html
  - title: About
    url: /pages/about.html
