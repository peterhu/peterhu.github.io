<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase Interpolator — Two Arrows</title>
<style>
  :root {
    --bg: #14141f; --panel: #1e1e2e; --ink: #e8e6f0; --dim: #8a87a0;
    --accent: #e0a34b; --line: #34344a; --day: #e0a34b; --night: #5a8fd0; --warn: #c0554f; --ok: #5fae6a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
    padding: 20px 14px 26px;
  }
  .head { text-align: center; margin-bottom: 12px; }
  .head .tag { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .head h1 { font-size: 18px; font-weight: 600; margin-top: 3px; }
  .head .sub { color: var(--dim); font-size: 12px; margin-top: 2px; }

  .scene { width: 100%; max-width: 640px; border-radius: 12px; background: #1a1a28; border: 1px solid var(--line); overflow: hidden; }
  .scene svg { display: block; width: 100%; height: auto; }

  .readout { margin-top: 10px; font-size: 14px; color: var(--ink); text-align: center; }
  .readout b { color: var(--ok); }

  .controls { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #14141f; border-color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

  <div class="head">
    <div class="tag">Phase Interpolator</div>
    <h1>Two Arrows, One Phase</h1>
    <div class="sub">Weight I and Q, add the vectors — the sum arrow points at the phase.</div>
  </div>

  <div class="scene">
    <svg id="scene" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
      <!-- axes -->
      <line x1="90" y1="200" x2="450" y2="200" stroke="#8a87a0" stroke-width="1.5"/>
      <line x1="90" y1="200" x2="90" y2="40" stroke="#8a87a0" stroke-width="1.5"/>

      <!-- I arrow (right) -->
      <line x1="90" y1="200" x2="330" y2="200" stroke="#5a8fd0" stroke-width="3"/>
      <polygon points="330,200 322,194 322,206" fill="#5a8fd0"/>
      <text x="330" y="188" fill="#5a8fd0" font-size="12" font-weight="600">I (0°)</text>

      <!-- Q arrow (up) -->
      <line x1="90" y1="200" x2="90" y2="70" stroke="#e0a34b" stroke-width="3"/>
      <polygon points="90,70 84,78 96,78" fill="#e0a34b"/>
      <text x="46" y="72" fill="#e0a34b" font-size="12" font-weight="600">Q (90°)</text>

      <!-- sum arrow (rotating) -->
      <line id="sumArrow" x1="90" y1="200" x2="330" y2="200" stroke="#5fae6a" stroke-width="4"/>
      <polygon id="sumHead" points="330,200 322,192 322,208" fill="#5fae6a"/>
      <text id="sumLabel" x="200" y="130" fill="#5fae6a" font-size="13" font-weight="600">sum = phase</text>

      <!-- dashed helper for the projection -->
      <line id="projH" x1="90" y1="200" x2="90" y2="200" stroke="#8a87a0" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
      <line id="projV" x1="90" y1="200" x2="90" y2="200" stroke="#8a87a0" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>

      <text x="270" y="248" text-anchor="middle" fill="#8a87a0" font-size="11">more current to I → arrow tips right · more to Q → arrow tips up</text>
    </svg>
  </div>

  <div class="readout">output phase θ = <b id="deg">0</b>°</div>

  <div class="controls">
    <button id="toggle" class="primary">Pause</button>
  </div>

<script>
  const AX = 90, AY = 200, LEN = 130;
  const sumArrow = document.getElementById('sumArrow');
  const sumHead = document.getElementById('sumHead');
  const sumLabel = document.getElementById('sumLabel');
  const projH = document.getElementById('projH');
  const projV = document.getElementById('projV');
  const degEl = document.getElementById('deg');
  const toggle = document.getElementById('toggle');

  let running = true;
  let t0 = null;

  function frame(now) {
    if (t0 === null) t0 = now;
    const t = (now - t0) / 1000;           // seconds
    // sweep 0° -> 90° -> 0°, 6s per full cycle
    const cycle = (t % 6) / 6;
    const theta = cycle <= 0.5 ? cycle * 2 * 90 : (1 - cycle) * 2 * 90;
    const rad = theta * Math.PI / 180;

    const tx = AX + LEN * Math.cos(rad);
    const ty = AY - LEN * Math.sin(rad);

    sumArrow.setAttribute('x2', tx);
    sumArrow.setAttribute('y2', ty);
    // arrow head perpendicular to the arrow direction
    const hx = tx - 14 * Math.cos(rad);
    const hy = ty + 14 * Math.sin(rad);
    const px = tx - 12 * Math.sin(rad);
    const py = ty - 12 * Math.cos(rad);
    const qx = tx + 12 * Math.sin(rad);
    const qy = ty + 12 * Math.cos(rad);
    sumHead.setAttribute('points', `${tx},${ty} ${px},${py} ${qx},${qy}`);

    // projection helpers
    projH.setAttribute('x1', tx); projH.setAttribute('y1', ty);
    projH.setAttribute('x2', tx); projH.setAttribute('y2', AY);
    projV.setAttribute('x1', tx); projV.setAttribute('y1', ty);
    projV.setAttribute('x2', AX); projV.setAttribute('y2', ty);

    // label near the arrow tip
    sumLabel.setAttribute('x', AX + (LEN + 22) * Math.cos(rad) - 60);
    sumLabel.setAttribute('y', AY - (LEN + 22) * Math.sin(rad) - 8);

    degEl.textContent = Math.round(theta);

    if (running) requestAnimationFrame(frame);
  }

  toggle.addEventListener('click', () => {
    running = !running;
    toggle.textContent = running ? 'Pause' : 'Play';
    if (running) { t0 = null; requestAnimationFrame(frame); }
  });

  requestAnimationFrame(frame);
</script>
</body>
</html>
