<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DRAM Detective — The Address Book</title>
<style>
  :root {
    --bg: #14141f;
    --panel: #1e1e2e;
    --ink: #e8e6f0;
    --dim: #8a87a0;
    --accent: #e0a34b;
    --line: #34344a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }
  .head { text-align: center; margin-bottom: 18px; }
  .head .tag { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); }
  .head h1 { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .head .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }

  .stage { display: flex; align-items: flex-start; gap: 22px; max-width: 760px; width: 100%; }

  .detective { flex: 0 0 130px; text-align: center; position: relative; padding-top: 10px; }
  .detective svg { width: 110px; height: 110px; transition: transform .35s ease; }
  .detective .bubble {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 10px; font-size: 12.5px; line-height: 1.45; margin-top: 8px; text-align: left;
    min-height: 62px; color: var(--ink);
  }
  .detective .bubble b { color: var(--accent); }

  .levels { flex: 1; }
  .level {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px;
    opacity: .22; transform: translateX(-8px);
    transition: opacity .3s ease, transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    position: relative;
  }
  .level .lname { font-weight: 600; font-size: 15px; }
  .level .lsub { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .level .lcount { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--accent); font-weight: 700; }
  .level.seen  { opacity: .55; transform: translateX(0); }
  .level.active { opacity: 1; transform: translateX(0); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  .golden {
    margin-top: 16px; background: linear-gradient(180deg, #2a2317, #1e1a12);
    border: 1px solid var(--accent); border-radius: 12px; padding: 16px 18px;
    text-align: center; max-width: 760px; width: 100%;
    opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease;
  }
  .golden.show { opacity: 1; transform: translateY(0); }
  .golden .q { font-size: 13px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  .golden .rule { font-size: 18px; font-weight: 700; color: var(--accent); margin-top: 6px; line-height: 1.4; }

  .controls { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
  button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #14141f; border-color: var(--accent); font-weight: 600; }
  .hint { color: var(--dim); font-size: 12px; }

  @media (max-width: 560px) {
    .stage { flex-direction: column; align-items: center; }
    .detective { flex: none; }
    .levels { width: 100%; }
  }
</style>
</head>
<body>

  <div class="head">
    <div class="tag">DRAM Detective · Case File 0.1</div>
    <h1>The Address Book</h1>
    <div class="sub">Every byte of memory lives at an address — the detective walks down to find it.</div>
  </div>

  <div class="stage">
    <div class="detective">
      <svg id="det" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
        <path d="M48 102 L112 102 L123 158 L37 158 Z" fill="#33465c"/>
        <path d="M48 102 L112 102 L106 112 L54 112 Z" fill="#28394d"/>
        <rect x="72" y="88" width="16" height="15" fill="#f5cd9f"/>
        <ellipse cx="80" cy="66" rx="22" ry="24" fill="#f5cd9f"/>
        <ellipse cx="89" cy="71" rx="8" ry="5.5" fill="#eab98c"/>
        <circle cx="70" cy="64" r="2.6" fill="#26262b"/>
        <circle cx="85" cy="64" r="2.6" fill="#26262b"/>
        <path d="M63 57 L75 55" stroke="#26262b" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M83 55 L92 57" stroke="#26262b" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M53 42 Q54 18 80 16 Q106 18 107 42 Z" fill="#8f6c4a"/>
        <path d="M53 42 Q80 51 107 42 L107 44 Q80 53 53 44 Z" fill="#7a5a3e"/>
        <rect x="53" y="37" width="54" height="5" fill="#6b4e35"/>
        <path d="M53 41 Q45 53 47 61 Q59 59 60 46 Z" fill="#8f6c4a"/>
        <path d="M107 41 Q115 53 113 61 Q101 59 100 46 Z" fill="#8f6c4a"/>
        <line x1="109" y1="81" x2="124" y2="96" stroke="#4a3a28" stroke-width="5" stroke-linecap="round"/>
        <circle cx="98" cy="64" r="15" fill="#cfe9f4" opacity="0.55" stroke="#4a3a28" stroke-width="4.5"/>
      </svg>
      <div class="bubble" id="bubble">Following the address book…</div>
    </div>

    <div class="levels" id="levels"></div>
  </div>

  <div class="golden" id="golden">
    <div class="q">The golden rule</div>
    <div class="rule">To find who's guilty,<br>check whether their siblings died too.</div>
  </div>

  <div class="controls">
    <button id="replay" class="primary">↺ Replay</button>
    <span class="hint">auto-plays top to bottom · click a level to jump</span>
  </div>

<script>
  var LEVELS = [
    { name: "Socket",      sub: "The CPU package. One board, two sockets on a server.", count: "×2" },
    { name: "Memory Controller (IMC)", sub: "The brain inside the CPU that talks to DRAM.", count: "" },
    { name: "Channel",     sub: "One independent bus out of the controller.", count: "×8" },
    { name: "DIMM",        sub: "The physical stick. The smallest thing you can unplug and swap.", count: "" },
    { name: "Subchannel",  sub: "DDR5 splits each DIMM into 2 independent 40-bit channels.", count: "×2" },
    { name: "Rank",        sub: "A group of DRAMs making up one subchannel. SR = 1, DR = 2.", count: "SR / DR" }
  ];

  var STEP_MS = 1800;
  var idx = -1;  // -1..5 = level, 6 = golden rule
  var timer = null;
  var elLevels = document.getElementById('levels');
  var elBubble = document.getElementById('bubble');
  var elGolden = document.getElementById('golden');
  var elReplay = document.getElementById('replay');
  var elDet = document.getElementById('det');

  LEVELS.forEach(function (L, i) {
    var d = document.createElement('div');
    d.className = 'level';
    d.innerHTML = '<div class="lname">' + L.name + '</div><div class="lsub">' + L.sub + '</div>' +
                  (L.count ? '<div class="lcount">' + L.count + '</div>' : '');
    d.addEventListener('click', function () { go(i); });
    elLevels.appendChild(d);
  });
  var cards = elLevels.querySelectorAll('.level');

  function go(n) {
    idx = Math.max(-1, Math.min(6, n));
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.toggle('active', i === idx);
      cards[i].classList.toggle('seen', i < idx);
    }
    elDet.style.transform = idx >= 0 ? 'translateY(' + (idx * 2) + 'px) rotate(-3deg)' : 'none';

    if (idx === -1) {
      elBubble.innerHTML = 'Following the address book…';
    } else if (idx < LEVELS.length) {
      elBubble.innerHTML = '<b>' + LEVELS[idx].name + '</b> — ' + LEVELS[idx].sub;
    } else {
      elBubble.innerHTML = 'Case closed. The address book is the map — <b>now you can name a suspect.</b>';
    }
    elGolden.classList.toggle('show', idx === 6);
    scheduleNext();
  }

  function scheduleNext() {
    if (timer) clearTimeout(timer);
    if (idx < 6) {
      timer = setTimeout(function () { go(idx + 1); }, STEP_MS);
    }
  }

  elReplay.addEventListener('click', function () { go(-1); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') go(idx + 1);
    if (e.key === 'ArrowLeft')  go(idx - 1);
  });

  // start the auto-play
  setTimeout(function () { go(0); }, 600);
</script>
</body>
</html>
